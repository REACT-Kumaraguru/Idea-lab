services:
  postgres:
    image: postgres:16-alpine
    container_name: idealab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: idealab_db
      POSTGRES_USER: idealab_admin
      POSTGRES_PASSWORD: idealab_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idealab_admin -d idealab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
