# ==============================================================================
# AICTE IDEA LAB - KUMARAGURU COLLEGE OF TECHNOLOGY (KCT)
# PRODUCTION NGINX REVERSE PROXY & SSL CONFIGURATION
# ==============================================================================

upstream idealab_backend {
    server 127.0.0.1:5003;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name idealab.kct.ac.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name idealab.kct.ac.in;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/idealab.kct.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/idealab.kct.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Max Upload Size (CAD models, prototypes, ZIPs up to 50MB)
    client_max_body_size 50M;

    # Gzip Compression for Fast 4G/Wi-Fi Performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Frontend Single Page App (Built Vite dist)
    root /var/www/idealab/frontend/dist;
    index index.html;

    # Static Assets with 30-Day Browser Caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Public File Uploads
    location /uploads/ {
        alias /var/data/idealab_uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Live Real-Time Emergency Announcement Stream (SSE)
    location ~ ^/api/.*/announcements/stream {
        proxy_pass http://idealab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical SSE Buffering Controls
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # API Backend Endpoints
    location /api/ {
        proxy_pass http://idealab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # SPA Fallback: Any unknown route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
