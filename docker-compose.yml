services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idea_lab
      POSTGRES_PASSWORD: idea_lab_secret
      POSTGRES_DB: idea_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea_lab -d idea_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://idea_lab:idea_lab_secret@postgres:5432/idea_lab
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5001:5001"
    volumes:
      - backend_uploads:/app/src/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5173}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
