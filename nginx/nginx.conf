map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name idealab.kct.ac.in localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name idealab.kct.ac.in localhost;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/ssl/certs/idealab.kct.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/idealab.kct.ac.in.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve uploaded hackathon files directly from shared Docker volume.
    # URL: /download/hackathon/<filename>
    location /download/hackathon/ {
        alias /app/uploads/hackathon/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Backward compatibility: old frontend links (/src/uploads/...)
    location /src/uploads/ {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /api {
        proxy_pass http://backend:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_set_header Cookie $http_cookie;
        proxy_cookie_path / /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
