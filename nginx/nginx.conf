    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name react.kct.ac.in;

    ssl_certificate /etc/ssl/certs/idealab.kct.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/idealab.kct.ac.in.key;

    return 301 https://react.kumaraguru.in$request_uri;
}


# REACT KUMARAGURU SITE

server {
    listen 80;
    server_name react.kumaraguru.in;

    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name react.kumaraguru.in;

    ssl_certificate /etc/ssl/certs/idealab.kct.ac.in.crt;
    ssl_certificate_key /etc/ssl/private/idealab.kct.ac.in.key;
    
    location / {
        proxy_pass http://react-frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://react-api:4000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

