name: CI Quality & Security Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-syntax-check:
    name: Backend Syntax & Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check Backend Syntax
        working-directory: ./backend
        run: |
          node --check server.js
          node --check src/middleware/csrf.middleware.js
          node --check src/middleware/rateLimit.middleware.js
          node --check src/controllers/hackathon/hackathonVolunteer.controller.js
          node --check src/controllers/hackathon/hackathonSystemDiagnostic.controller.js

  frontend-build:
    name: Frontend Build & Code-Split Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build
